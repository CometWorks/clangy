[project]
name = "clangy"
version = "0.1.0"
description = "Clangy v2, the support bot of the Pulsar Discord server"
authors = [
    { name = "Viktor Ferenczi", email = "viktor@ferenczi.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "discord-py>=2.7.1",
    "markdown>=3.9",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
clangy = "clangy.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.black]
line-length = 120
target-version = ["py312"]
