# Config of the nas deployment, lives at /home/clangy/clangy.toml (mode 600, it holds the token).
# deploy.sh never overwrites it.
data_dir = "/home/clangy/data"
# The home folder is the workspace of tickets, notes and plans
workspace_dir = "/home/clangy"
discord_token = ""
run_deadline = 900.0
# Posts reviews to GitHub, which the sandbox can't reach
hidden_skills = ["se-dev-plugin-review", "se2-dev-plugin-review"]
# Caps the context on every backend; unset means the smallest backend context_window
# context_window = 131072

# Tickets go to the Support project; the API key is TASKS_PASS from ~/.bashrc
[tasks]
url = "https://tasks.cometworks.se"
project = 8

[sandbox]
firejail = true
pi_command = ["/home/clangy/.pi/agent/bin/pi"]
# pi's launcher looks for its Node.js under $HOME, which is the work folder in the sandbox.
# uv runs the skills' scripts.
path = "/home/clangy/.pi/agent/bin:/home/clangy/.local/share/pi-node/current/bin:/home/clangy/.local/bin:/usr/bin:/bin"
# Not all of ~/.pi/agent: auth.json and the user's own sessions stay hidden.
# uv's Python installs back the skills' venvs (the SE1 skills pin Python 3.11).
read_only = [
    "/home/clangy/.pi/agent/bin",
    "/home/clangy/.pi/agent/install",
    "/home/clangy/.local/share/pi-node",
    "/home/clangy/.local/bin",
    "/home/clangy/.local/share/uv/python",
    # graphify, for the code skills' graph queries (uv tool install graphifyy)
    "/home/clangy/.local/share/uv/tools",
    # SE1 workshop content, which the se-dev-mod skill reads in place
    "/home/clangy/.steam/debian-installation/steamapps/workshop/content/244850",
]
# The skills and their venvs are read-only: uv must use the venvs as they are, offline.
# There's no game on the host: SE_GAME_ROOT only tells the se-dev-mod skill where the workshop folder is.
env = { UV_NO_SYNC = "1", UV_OFFLINE = "1", UV_PYTHON_DOWNLOADS = "never", SE_GAME_ROOT = "/home/clangy/.steam/debian-installation/steamapps/common/SpaceEngineers" }
# squid on the host with a domain allowlist; commands in the sandbox get HTTP(S)_PROXY pointing to it
proxy = "127.0.0.1:3128"
# Builds the sandboxes' shared Python environment (numpy, matplotlib, pydantic) with Debian's Python
uv = "/home/clangy/.local/bin/uv"
python = "/usr/bin/python3"

[[backends]]
name = "polaris"
url = "http://polaris:8080/v1"
model = "qwen38v-Q5"
kind = "llamacpp"
priority = 5
parallel = 1
context_window = 167936
max_tokens = 4096
images = true          # llama.cpp loads the vision projector (--mmproj)
thinking = "minimal"
compat = { thinkingFormat = "qwen-chat-template" }
prompt_tps = 350.0
gen_tps = 50.0

