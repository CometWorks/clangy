# Chat channel: a mention starts a thread with Clangy
[[channels]]
id = 1556065388943511683
mode = "mention"

# Request forum: recorded, answers mentions in the threads, no first answer
[[channels]]
id = 1556065635589423164
mode = "record"

# Support forum: answers new threads once they have been quiet for 2 minutes
[[channels]]
id = 1556065514848002179
mode = "support"
initial_response = true
initial_delay = 120.0

# Ecosystem and plugin repos for every conversation, kept up to date by ~/repos/clone-or-pull
[[mounts]]
link = "repos"
path = "/home/clangy/repos"

[[knowledge.se1]]
link = "knowledge/skills"
path = "/home/clangy/skills/skills"

[[knowledge.se1]]
link = "knowledge/books"
path = "/home/clangy/se-dev-books/skills"

[[knowledge.se1]]
link = ".se-dev"
path = "/home/clangy/.se-dev"

[[knowledge.se2]]
link = "knowledge/skills"
path = "/home/clangy/skills2/skills"

[[knowledge.se2]]
link = "knowledge/books"
path = "/home/clangy/se2-dev-books/skills"

[[knowledge.se2]]
link = ".se2-dev"
path = "/home/clangy/.se2-dev"
