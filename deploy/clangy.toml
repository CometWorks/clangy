# Ecosystem and plugin repos for every conversation, kept up to date by ~/repos/clone-or-pull
[[mounts]]
link = "repos"
path = "/home/clangy/repos"

# Prepared data of the SE1 and SE2 skills. Their Data folders link here, and the skills are readable
# in every conversation through repos/, so both are mounted whatever the game.
[[mounts]]
