# Support forum: answers new posts, then only when mentioned
[[channels]]
id = 100000000000000001
mode = "support"
initial_response = true

# Request forum: records the threads, answers only when mentioned
[[channels]]
id = 100000000000000002
mode = "record"

# Chat channel: a mention starts a thread with Clangy
[[channels]]
id = 100000000000000003
mode = "mention"
game = "se1"
prompt = "This is the SE1 plugin developer channel. Most questions are about plugin development."

# Each source becomes a link in the conversation's work folder. Folders (path) are used in place,
# git repositories (url) are mirrored by `clangy sync-knowledge`.
[[knowledge.se1]]
link = "knowledge/skills"
path = "/home/clangy/skills/skills"

[[knowledge.se1]]
link = "knowledge/books"
url = "https://git.cometworks.se/CometWorks/se-dev-books.git"

[[knowledge.se1]]
link = ".se-dev"
path = "/home/clangy/.se-dev"

[[knowledge.se2]]
link = "knowledge/skills"
path = "/home/clangy/skills2/skills"

[[knowledge.se2]]
link = "knowledge/books"
path = "/home/clangy/se2-dev-books/skills"

[[knowledge.se2]]
link = ".se2-dev"
path = "/home/clangy/.se2-dev"
