# Copy to config.toml and adjust. See docs/configuration.md.

data_dir = "/srv/clangy"
discord_token = ""
run_deadline = 600.0
attachment_max_bytes = 26214400
answer_max_bytes = 10485760
progress_interval = 60.0
health_interval = 30.0
max_retries = 3
switch_margin = 60.0
retention_days = 30

[sandbox]
firejail = true
pi_command = ["pi"]
path = "/opt/node/bin:/usr/bin:/bin"
read_only = ["/opt/node"]

[[backends]]
name = "r9700"
url = "http://192.168.1.20:8080/v1"
model = "qwen3.8-27b-q5"
kind = "llamacpp"
priority = 2
parallel = 2
slot_save = true
context_window = 131072
max_tokens = 4096
thinking = "low"
compat = { thinkingFormat = "qwen-chat-template" }
prompt_tps = 300.0
gen_tps = 40.0

# OpenRouter's free models as a second backend. The key goes into api_key (keep this file mode 600) or the
# environment variable named by api_key_env. Free models: 20 requests a minute and 1000 a day per account.
